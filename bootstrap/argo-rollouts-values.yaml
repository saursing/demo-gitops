controller:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.17.0/gatewayapi-plugin-linux-amd64

# Chart default already grants the controller RBAC to edit HTTPRoutes (providerRBAC.providers.gatewayAPI: true)

dashboard:
  enabled: false                 # we'll use the local `kubectl argo rollouts dashboard` instead
